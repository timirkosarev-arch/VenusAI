<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Venus AI</title>

<link rel="icon" href="https://i.ibb.co.com/wryLQv5P/photo-2026-11-03-00-49-56.jpg">

<style>
:root {
  --bg:#050505;
  --side:#090909;
  --panel:#151515;
  --panel2:#26143d;
  --line:#39205c;
  --text:#f5f0ff;
  --muted:#a995cf;
  --accent:#a855f7;
  --accent2:#7c3aed;
  --user:#291344;
  --ava:url("https://i.ibb.co.com/wryLQv5P/photo-2026-11-03-00-49-56.jpg");
}

* {box-sizing:border-box;margin:0}
[hidden] {display:none!important}
html,body {height:100%}
body {
  background:var(--bg);
  color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input,textarea,select {font:inherit}
button {color:inherit;cursor:pointer}
.logo,.av {
  background:var(--ava) center/cover no-repeat;
  flex-shrink:0;
}
.logo {
  width:34px;height:34px;border-radius:50%;
  box-shadow:0 0 20px #9333ea66;
}
.av {width:36px;height:36px;border-radius:50%}

/* AUTHENTICATION */

.auth-screen {
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:auto;
  background:
    radial-gradient(ellipse at 50% 15%,#35125355,transparent 55%),
    #050505;
}
.auth-card {
  width:100%;
  max-width:420px;
  padding:28px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#101010;
  box-shadow:0 15px 70px #000;
}
.auth-back {
  display:block;
  margin:0 0 14px;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#151019;
  color:#d8b4fe;
  font-size:13px;
}
.auth-back:hover {background:#211333}
.auth-head {text-align:center;margin-bottom:22px}
.auth-head .logo {
  width:76px;height:76px;
  margin:0 auto 14px;
}
.auth-head h1 {font-size:27px}
.auth-head p {color:var(--muted);font-size:14px}
.auth-google {
  width:100%;
  padding:12px;
  background:#f5f5f5;
  color:#171717;
  border-radius:12px;
  font-weight:600;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  border:0;
}
.google-g {
  font-size:21px;
  font-weight:800;
  color:#4285f4;
}
.auth-divider {
  display:flex;
  align-items:center;
  gap:12px;
  margin:17px 0;
  color:var(--muted);
  font-size:13px;
}
.auth-divider:before,.auth-divider:after {
  content:"";height:1px;background:var(--line);flex:1;
}
.auth-form {display:flex;flex-direction:column;gap:11px}
.auth-form input {
  width:100%;
  padding:12px 14px;
  border-radius:11px;
  border:1px solid var(--line);
  outline:none;
  background:#090909;
  color:white;
}
.auth-form input:focus {border-color:var(--accent)}
.auth-primary {
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#a855f7,#6d28d9);
  font-weight:700;
}
.auth-primary:disabled {opacity:.5}
.auth-switch {
  width:100%;
  margin-top:17px;
  color:#c084fc;
  font-size:14px;
  background:none;
}
.auth-error {
  color:#ff9db0;
  font-size:13px;
  padding:9px;
  background:#35101e;
  border-radius:9px;
  display:none;
}
.auth-info {
  font-size:11px;
  color:var(--muted);
  text-align:center;
  margin-top:17px;
}

/* APPLICATION */

.app {display:flex;height:100%}

.side {
  width:268px;
  background:var(--side);
  display:flex;
  flex-direction:column;
  padding:10px;
  gap:8px;
  flex-shrink:0;
  transition:transform .25s;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  font-weight:700;
  font-size:18px;
}
.new {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:10px;
  text-align:left;
  background:#1c102b;
}
.new:hover {background:#32194e}
.list {
  flex:1;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.chat {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 12px;
  border-radius:10px;
  font-size:14px;
  gap:6px;
}
.chat:hover {background:var(--panel)}
.chat.on {background:var(--panel2)}
.chat span {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}
.chat .x {
  opacity:0;
  color:var(--muted);
  padding:0 4px;
}
.chat:hover .x {opacity:1}
@media(hover:none) {.chat .x {opacity:.6}}

.foot {border-top:1px solid var(--line);padding-top:10px}
.foot-actions {
  display:flex;
  gap:7px;
}
.foot-actions .new {
  flex:1;
  justify-content:center;
  font-size:13px;
  padding:10px 5px;
  min-width:0;
}
.telegram {
  color:#d8b4fe;
  text-decoration:none;
}
.register-guest {
  width:100%;
  justify-content:center;
  margin:10px 0 4px;
  border:1px solid #493064;
  color:#e9d5ff;
  background:#211333;
}
.register-guest:hover {background:#32194e;border-color:#72509a}
.account {
  display:flex;
  align-items:center;
  gap:9px;
  padding:12px 5px 5px;
  min-width:0;
}
.account-avatar {width:30px;height:30px;border-radius:50%;background:var(--ava) center/cover}
.account-info {flex:1;min-width:0}
.account-info div {
  font-size:13px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.account-info small {font-size:11px;color:var(--muted)}
.logout {
  padding:7px;
  color:#c084fc;
  font-size:12px;
  border-radius:8px;
}
.logout:hover {background:var(--panel2)}

.main {
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  height:100%;
  background:#050505;
}
.top {
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.burger {
  display:none;
  padding:6px 8px;
  border-radius:8px;
  font-size:20px;
  background:none;
  border:0;
  color:white;
}
.title {
  font-weight:600;
  color:var(--muted);
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.msgs {flex:1;overflow:auto;scroll-behavior:smooth}
.wrap {max-width:760px;margin:0 auto;padding:16px 18px 24px}
.row {display:flex;gap:14px;margin:22px 0}
.row.u {justify-content:flex-end}
.bub {
  min-width:0;
  max-width:100%;
  overflow-wrap:anywhere;
}
.u .bub {
  background:var(--user);
  padding:10px 16px;
  border-radius:20px;
  max-width:82%;
  white-space:pre-wrap;
}
.bub p {margin:0 0 .8em}
.bub p:last-child {margin:0}
.bub ul,.bub ol {margin:0 0 .8em 1.3em}
.bub h1,.bub h2,.bub h3 {margin:.9em 0 .4em;line-height:1.3}
.bub h1 {font-size:1.4em}
.bub h2 {font-size:1.2em}
.bub h3 {font-size:1.05em}
.bub code {
  background:var(--panel2);
  padding:1px 6px;
  border-radius:6px;
  font:13.5px ui-monospace,monospace;
}
.bub a {color:#c084fc}

.pre {
  background:#0c0618;
  border:1px solid var(--line);
  border-radius:12px;
  margin:.6em 0 .9em;
  overflow:hidden;
}
.pre .h {
  display:flex;
  justify-content:space-between;
  padding:6px 12px;
  background:var(--panel);
  font-size:12px;
  color:var(--muted);
}
.pre pre {
  padding:12px;
  overflow:auto;
  font:13px/1.5 ui-monospace,monospace;
}
.pre code {background:none;padding:0}
.pre button {background:none;border:0;color:#c084fc;cursor:pointer}

.dots {display:inline-flex;gap:4px;padding:8px 0}
.dots i {
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  animation:b 1s infinite;
}
.dots i:nth-child(2) {animation-delay:.15s}
.dots i:nth-child(3) {animation-delay:.3s}
@keyframes b {
  0%,60%,100% {opacity:.25}
  30% {opacity:1;transform:translateY(-3px)}
}
.err {
  color:#ff9db0;
  background:#3a1020;
  border:1px solid #6b2040;
  padding:10px 14px;
  border-radius:12px;
}

/* HERO */

.hero {
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  text-align:center;
  padding:20px;
}
.hero .logo {
  width:76px;height:76px;
  box-shadow:0 0 50px #a855f77a;
}
.hero h1 {font-size:28px}
.hero p {color:var(--muted);max-width:420px}
.sugs {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:6px;
}
.sugs button {
  border:1px solid #6d28d9;
  border-radius:14px;
  padding:9px 14px;
  font-size:14px;
  color:#d8b4fe;
  background:#101010;
}
.sugs button:hover {background:#32194e}

/* COMPOSER */

.comp {
  padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));
}
.box {
  max-width:760px;
  margin:0 auto;
  background:var(--panel);
  border:1px solid #33243f;
  border-radius:21px;
  display:flex;
  align-items:flex-end;
  gap:6px;
  padding:5px 7px 5px 14px;
  box-shadow:none;
}
.box:focus-within {border-color:#72509a;box-shadow:none}
textarea {
  flex:1;
  background:none;
  border:0;
  outline:0;
  color:var(--text);
  resize:none;
  max-height:160px;
  min-width:0;
  min-height:28px;
  padding:4px 0;
  line-height:1.45;
}
textarea::placeholder {color:var(--muted)}

.model-select {
  width:128px;
  max-width:34%;
  background:#211333;
  color:#e9d5ff;
  border:1px solid #6d28d9;
  border-radius:12px;
  outline:none;
  padding:8px 5px;
  font-size:12px;
  height:36px;
  cursor:pointer;
}
.send {
  width:36px;height:36px;
  border-radius:50%;
  background:linear-gradient(135deg,#a855f7,#6d28d9);
  display:grid;
  place-items:center;
  flex-shrink:0;
  color:white;
  border:0;
}
.send:hover {background:linear-gradient(135deg,#c084fc,#9333ea)}
.send:disabled {opacity:.35;cursor:default}
.note {
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

.attach {
  width:36px;height:36px;flex-shrink:0;
  display:grid;place-items:center;
  border:1px solid var(--line);border-radius:50%;
  background:#211333;color:#e9d5ff;font-size:19px;
}
.attach:hover {background:#39205c;border-color:var(--accent)}
.attach:disabled {opacity:.4;cursor:wait}
.attachment-tray {
  max-width:760px;margin:9px auto 0;
  display:flex;flex-wrap:wrap;gap:8px;
}
.attachment-item {
  position:relative;width:92px;min-height:76px;
  background:#17101f;border:1px solid var(--line);
  border-radius:12px;padding:6px;overflow:hidden;
  display:flex;flex-direction:column;gap:4px;
}
.attachment-item img {width:100%;height:66px;object-fit:cover;border-radius:7px}
.attachment-item .file-icon {font-size:25px;text-align:center;line-height:40px}
.attachment-item .file-name {
  font-size:10px;color:var(--muted);overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;
}
.attachment-item .remove-attachment {
  position:absolute;right:4px;top:4px;width:22px;height:22px;
  border-radius:50%;background:#090909dd;color:#fff;
  display:grid;place-items:center;font-size:13px;
}
.attachment-hint {font-size:11px;color:var(--muted);width:100%}
.user-attachments {display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;max-width:330px}
.user-attachments img {
  width:min(180px,42vw);height:150px;object-fit:cover;
  border-radius:11px;border:1px solid var(--line);background:#111;
}
.user-file {
  display:flex;align-items:center;gap:7px;padding:7px 10px;
  background:#17101f;border:1px solid var(--line);
  border-radius:9px;color:#e9d5ff;font-size:12px;max-width:230px;
}
.user-file span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.message-actions {display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.message-actions button {
  border:1px solid var(--line);border-radius:9px;
  padding:6px 9px;color:#d8b4fe;background:#100b17;font-size:11px;
}
.message-actions button:hover {background:#2a1740;border-color:var(--accent)}
.pre .h {align-items:center;gap:8px}
.pre .h .code-actions {display:flex;gap:10px}
.pre .h button {font-size:11px}

/* SETTINGS */

.mod {
  position:fixed;
  inset:0;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:30;
}
.mod.on {display:flex}
.card {
  background:#151515;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  width:100%;
  max-width:440px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.card h2 {font-size:18px}
.card label {
  font-size:13px;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:5px;
}
.card textarea {
  background:#090909;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  color:white;
  width:100%;
  min-height:130px;
  max-height:250px;
}
.btns {display:flex;gap:8px;justify-content:flex-end}
.btn {
  padding:9px 16px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#211333;
  color:white;
}
.btn.p {
  background:linear-gradient(135deg,#a855f7,#6d28d9);
  border:0;
}
.back {display:none}

@media(max-width:800px) {
  .side {
    position:fixed;
    inset:0 auto 0 0;
    z-index:20;
    transform:translateX(-100%);
    width:280px;
  }
  .side.on {transform:none}
  .back.on {
    display:block;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:15;
  }
  .burger {display:block}
}
@media(max-width:400px) {
  .box {padding-left:12px;gap:5px}
  .model-select {width:105px;font-size:11px}
  .comp {padding-left:8px;padding-right:8px}
}
::-webkit-scrollbar {width:8px}
::-webkit-scrollbar-thumb {background:var(--line);border-radius:8px}
</style>
</head>

<body>

<!-- AUTH SCREEN -->

<div class="auth-screen" id="authScreen" hidden>
  <div class="auth-card">

    <button class="auth-back" id="authBack" type="button">← Назад в чат</button>

    <div class="auth-head">
      <div class="logo"></div>
      <h1>Venus AI</h1>
      <p id="authSubtitle">Войдите, чтобы продолжить</p>
    </div>

    <button class="auth-google" id="googleBtn">
      <span class="google-g">G</span>
      Продолжить с Google
    </button>

    <div class="auth-divider">или через аккаунт</div>

    <form class="auth-form" id="authForm">

      <input id="aName"
        placeholder="Имя пользователя"
        autocomplete="nickname"
        hidden>

      <input id="aEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
        required>

      <input id="aPassword"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
        minlength="6"
        required>

      <input id="aConfirm"
        type="password"
        placeholder="Повторите пароль"
        autocomplete="new-password"
        minlength="6"
        hidden>

      <div class="auth-error" id="authError"></div>

      <button class="auth-primary" id="authSubmit" type="submit">
        Войти
      </button>

    </form>

    <button class="auth-switch" id="authSwitch">
      Нет аккаунта? Зарегистрироваться
    </button>

    <div class="auth-info">
      Вход защищён Firebase Authentication.
    </div>

  </div>
</div>

<!-- MAIN APP -->

<div class="app" id="app">

  <aside class="side" id="side">

    <div class="brand">
      <div class="logo"></div>
      Venus AI
    </div>

    <button class="new" id="newBtn">＋ Новый чат</button>

    <div class="list" id="list"></div>

    <div class="foot">

      <div class="foot-actions">

        <button class="new" id="setBtn">⚙ Настройки</button>

        <a class="new telegram"
          href="https://t.me/venus1ai"
          target="_blank"
          rel="noopener">
          ✈ Telegram
        </a>

      </div>

      <button class="new register-guest" id="registerBtn" type="button">
        Войти / Регистрация
      </button>

      <div class="account">
        <div class="account-avatar"></div>

        <div class="account-info">
          <div id="accountName">Пользователь</div>
          <small id="accountEmail"></small>
        </div>

        <button class="logout" id="logoutBtn" title="Выйти" hidden>
          Выйти
        </button>
      </div>

    </div>

  </aside>

  <div class="back" id="back"></div>

  <main class="main">

    <div class="top">
      <button class="burger" id="burger">☰</button>
      <div class="title" id="ttl">Venus AI</div>
    </div>

    <div class="msgs" id="msgs">
      <div class="wrap" id="wrap"></div>
    </div>

    <div class="comp">

      <div class="box">

        <textarea
          id="inp"
          rows="1"
          placeholder="Напишите сообщение Venus AI…"
        ></textarea>

        <button class="attach" id="attachBtn" type="button" title="Прикрепить фото или файл" aria-label="Прикрепить фото или файл">📎</button>
        <input id="fileInput" type="file" hidden multiple
          accept="image/*,.pdf,.txt,.md,.json,.csv,.html,.htm,.css,.js,.mjs,.ts,.tsx,.jsx,.py,.lua,.java,.c,.cpp,.h,.cs,.go,.rs,.sql,.xml,.yaml,.yml,.toml,.ini,.log,.sh,.docx,.xlsx" />

        <select class="model-select" id="modelSelect"
          title="Автоматический резерв моделей или выбор приоритетной модели">
          <option value="__venus_auto_pool__">Авто · все модели</option>
          <option value="cohere/north-mini-code:free">North Mini Code</option>
          <option value="recursive/flint-v1.0:free">Flint</option>
          <option value="meituan/longcat-2.0:free">LongCat 2.0</option>
          <option value="inclusionai/ling-3.1-flash:free">Ling 3.1 Flash</option>
          <option value="tencent/hy3:free">Hy3</option>
          <option value="xingchen-agi/xing4.0-29b-a4b:free">Xing4.0</option>
          <option value="nvidia/nemotron-3.5-super-vl:free">Nemotron Super VL</option>
          <option value="dots-studio/dots-3-note-preview:free">Dots3 Note</option>
          <option value="liquid/lfm-2.5-2.6b:free">LFM 2.5</option>
          <option value="nvidia/nemotron-3.5-lightning:free">Nemotron Lightning</option>
          <option value="thinkingmachines/inkling-small:free">Inkling Small</option>
          <option value="nvidia/nemotron-3-ultra-550b-a55b:free">Nemotron Ultra</option>
          <option value="google/gemma-4-26b-a4b-it:free">Gemma 4 26B</option>
          <option value="google/gemma-4-31b-it:free">Gemma 4 31B</option>
        </select>

        <button class="send" id="send" disabled
          aria-label="Отправить">

          <svg width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>

        </button>

      </div>

      <div class="attachment-tray" id="attachmentTray" hidden></div>

      <div class="note">
        Фото, PDF, DOCX, XLSX и текстовые файлы можно прикреплять через скрепку.
        В режиме «Авто» используется резерв моделей, но ответ всегда один.
      </div>

    </div>

  </main>
</div>

<!-- SETTINGS -->

<div class="mod" id="mod">

  <div class="card">

    <h2>Настройки Venus AI</h2>

    <label>

const esc = s => String(s).replace(/[&<>"']/g,c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

function md(t) {

  const blocks = [];

  t = t.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c) => {
    blocks.push({l,c});
    return "\u0000" + (blocks.length-1) + "\u0000";
  });

  t = esc(t);

  const lines = t.split("\n");

  let out = "";
  let list = null;

  const close = () => {
    if (list) {
      out += "</" + list + ">";
      list = null;
    }
  };

  for (let ln of lines) {

    let m;

    const inl = s => s
      .replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');

    if (m=ln.match(/^(#{1,3})\s+(.*)/)) {

      close();
      out += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;

    } else if (m=ln.match(/^\s*[-*]\s+(.*)/)) {

      if (list!=="ul") {
        close();
        out += "<ul>";
        list="ul";
      }

      out += "<li>"+inl(m[1])+"</li>";

    } else if (m=ln.match(/^\s*\d+[.)]\s+(.*)/)) {

      if (list!=="ol") {
        close();
        out += "<ol>";
        list="ol";
      }

      out += "<li>"+inl(m[1])+"</li>";

    } else if (!ln.trim()) {

      close();

    } else if (/^\u0000\d+\u0000$/.test(ln.trim())) {

      close();
      out += ln.trim();

    } else {

      close();
      out += "<p>"+inl(ln)+"</p>";

    }

  }

  close();

  return out.replace(/\u0000(\d+)\u0000/g,(m,i) => {

    const b=blocks[+i];

    return `
      <div class="pre">
        <div class="h">
          <span>${esc(b.l || "код")}</span>
          <div class="code-actions">
            <button data-copy>Копировать</button>
            <button data-download-code data-lang="${esc((b.l || "txt").toLowerCase())}">Скачать файл</button>
          </div>
        </div>
        <pre><code>${esc(b.c.replace(/\n$/,""))}</code></pre>
      </div>
    `;

  });

}

function formatBytes(bytes) {

async function compressImage(file) {
  const bitmap=await createImageBitmap(file);
  const maxSide=1600;
  const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement("canvas");
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));
  canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  bitmap.close?.();
  return canvas.toDataURL("image/jpeg",0.82);
}

async function extractPdf(file) {
  const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];
  const count=Math.min(pdf.numPages,50);
  for(let n=1;n<=count;n++) {
    const page=await pdf.getPage(n);
    const content=await page.getTextContent();
    pages.push(content.items.map(x=>x.str).join(" "));
    if(pages.join("\n").length>MAX_EXTRACTED_CHARS) break;
  }
  let text=pages.join("\n\n");
  if(pdf.numPages>count) text+=`\n\n[Остальные страницы не извлечены: лимит ${count} страниц.]`;
  return text.slice(0,MAX_EXTRACTED_CHARS);
}

async function extractDocx(file) {
  const mod=await import("https://esm.sh/mammoth@1.9.0?bundle");
  const mammoth=mod.default||mod;
  const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
  return (result.value||"").slice(0,MAX_EXTRACTED_CHARS);
}

async function extractXlsx(file) {
  const XLSX=await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
  const workbook=XLSX.read(await file.arrayBuffer(),{type:"array"});
  const sections=[];
  for(const name of workbook.SheetNames) {
    const sheet=workbook.Sheets[name];
    sections.push(`Лист: ${name}\n`+XLSX.utils.sheet_to_csv(sheet));
    if(sections.join("\n").length>MAX_EXTRACTED_CHARS) break;
  }
  return sections.join("\n\n").slice(0,MAX_EXTRACTED_CHARS);
}

async function prepareFile(file) {
  if(file.size>MAX_FILE_BYTES) throw new Error(`${file.name}: файл больше 12 МБ.`);
  const id=makeId();
  const ext=fileExtension(file.name);
  let record={id,mediaId:id,name:file.name,type:file.type||"application/octet-stream",kind:"file"};
  let media={name:file.name,type:record.type};

  if(file.type.startsWith("image/")) {
    record.kind="image";
    media.dataUrl=await compressImage(file);
    record.sizeLabel=formatBytes(file.size);
    record.previewUrl=media.dataUrl;
  } else if(file.type==="application/pdf" || ext==="pdf") {
    media.text=await extractPdf(file);
    record.kind="document";
  } else if(ext==="docx") {
    media.text=await extractDocx(file);
    record.kind="document";
  } else if(ext==="xlsx") {
    media.text=await extractXlsx(file);
    record.kind="document";
  } else if(TEXT_EXTENSIONS.has(ext) || file.type.startsWith("text/")) {
    media.text=(await file.text()).slice(0,MAX_EXTRACTED_CHARS);
    record.kind="document";
  } else {
    throw new Error(`${file.name}: этот тип файла пока не поддерживается.`);
  }

  await putMedia(id,media);
  return record;
}

function renderPendingAttachments() {
  const tray=$("attachmentTray");
  tray.hidden=pendingAttachments.length===0;
  tray.innerHTML=pendingAttachments.map((a,i)=>`
    <div class="attachment-item">
      ${a.kind==="image"
        ? `<img src="${a.previewUrl}" alt="${esc(a.name)}">`
        : `<div class="file-icon">📄</div>`}
      <div class="file-name" title="${esc(a.name)}">${esc(a.name)}</div>
      <button class="remove-attachment" type="button" data-remove-attachment="${i}" aria-label="Убрать файл">×</button>
    </div>
  `).join("") + `<div class="attachment-hint">${pendingAttachments.length}/${MAX_ATTACHMENTS} вложений</div>`;
}

async function addFiles(fileList) {
  const files=Array.from(fileList||[]);
  if(!files.length) return;
  const remaining=MAX_ATTACHMENTS-pendingAttachments.length;
  if(remaining<=0) {
    alert(`Можно прикрепить максимум ${MAX_ATTACHMENTS} файлов за одно сообщение.`);
    return;
  }
  const chosen=files.slice(0,remaining);
  $("attachBtn").disabled=true;
  try {
    for(const file of chosen) {
      const record=await prepareFile(file);
      pendingAttachments.push(record);
    }
    if(pendingAttachments.some(a=>a.kind==="image") && $("modelSelect").value!==MODELS.medium) {
      $("modelSelect").value=MODELS.medium;
      if(currentUser) store.set(modelKey(currentUser.uid),MODELS.medium);
    }
    renderPendingAttachments();
    upd();
  } catch(e) {
    alert("Не удалось прикрепить файл: "+(e.message||e));
  } finally {
    $("attachBtn").disabled=false;
    $("fileInput").value="";
  }
}

async function buildApiMessages(chat) {
  const messages=[];
  if(systemPrompt) messages.push({role:"system",content:systemPrompt});

  for(const m of chat.messages) {
    const attachments=Array.isArray(m.attachments)?m.attachments:[];
    if(m.role!=="user" || !attachments.length) {
      messages.push({role:m.role,content:m.content||""});
      continue;
    }

    // ВАЖНО: текстовые документы отправляем обычной строкой content.
    // Это совместимо даже с простыми OpenAI-совместимыми прокси.
    // Массив content используем только тогда, когда реально есть изображения.
    let text=m.content||"";
    const imageParts=[];

    for(const attachment of attachments) {
      let stored=null;
      try { stored=await getMedia(attachment.mediaId); } catch(error) {}

      if(!stored) {
        text+=`\n\n[Не удалось прочитать вложение «${attachment.name}»: файл отсутствует в хранилище браузера. Прикрепите его повторно.]`;
        continue;
      }

      if(attachment.kind==="image") {
        if(stored.dataUrl) {
          imageParts.push({
            type:"image_url",
            image_url:{url:stored.dataUrl,detail:"auto"}
          });
          text+=`\n[Прикреплено изображение: ${attachment.name}. Изучи его содержимое.]`;
        } else {
          text+=`\n[Изображение «${attachment.name}» не удалось загрузить.]`;
        }
      } else if(typeof stored.text==="string") {
        text+=`\n\n===== НАЧАЛО ФАЙЛА: ${attachment.name} =====\n${stored.text}\n===== КОНЕЦ ФАЙЛА: ${attachment.name} =====`;
      } else {
        text+=`\n[Файл «${attachment.name}» прикреплён, но текст из него извлечь не удалось.]`;
      }
    }

    if(imageParts.length) {
      messages.push({
        role:"user",
        content:[{type:"text",text:text||"Изучи прикреплённое изображение."},...imageParts]
      });
    } else {
      // Документы, PDF, DOCX, XLSX, TXT, код и прочий текст — строкой.
      messages.push({role:"user",content:text||"Изучи прикреплённые файлы и помоги с ними."});
    }
  }

  return messages;
}

function downloadBlob(content,filename,mime="text/plain;charset=utf-8") {
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function extensionForLanguage(lang) {
  const map={javascript:"js",js:"js",typescript:"ts",ts:"ts",tsx:"tsx",jsx:"jsx",
    python:"py",py:"py",html:"html",css:"css",json:"json",xml:"xml",yaml:"yml",
    yml:"yml",markdown:"md",md:"md",sql:"sql",bash:"sh",sh:"sh",lua:"lua",
    java:"java",c:"c",cpp:"cpp",csharp:"cs",cs:"cs",go:"go",rust:"rs",rs:"rs",
    php:"php",ruby:"rb",rb:"rb",swift:"swift",kotlin:"kt",text:"txt",txt:"txt"};
  return map[lang]||"txt";
}

function cleanFilename(name) {
  return (name||"venus-ai-file").replace(/[^a-z0-9а-яё_-]+/gi,"_").replace(/^_+|_+$/g,"").slice(0,60)||"venus-ai-file";
}

function retryMessage(index) {
  const c=active();
  if(!c || busy || index<1) return;
  const previous=c.messages[index-1];
  if(!previous || previous.role!=="user") return;
  send(previous.content||"",previous.attachments||[]);
}

/* SEND */

async function send(text,attachmentsOverride=null) {

  text=(text||"").trim();
  const chosenAttachments=attachmentsOverride===null
    ? pendingAttachments.slice()
    : attachmentsOverride.slice();

  if((!text && !chosenAttachments.length)||busy||!currentUser)return;
  if(!text && chosenAttachments.length) text="Посмотри прикреплённые файлы и помоги с ними.";

  let c=active();
  if(!c) {
    const firstName=chosenAttachments[0]?.name||text;
    c={id:Date.now(),title:firstName.slice(0,40),messages:[]};
    currentChats.unshift(c);
    cur=c.id;
  }

  const storedAttachments=chosenAttachments.map(a=>({
    mediaId:a.mediaId,name:a.name,type:a.type,kind:a.kind
  }));

  c.messages.push({role:"user",content:text,attachments:storedAttachments});

  if(attachmentsOverride===null) {
    pendingAttachments=[];
    renderPendingAttachments();
  }

  $("inp").value="";
  grow();
  upd();
  saveChats();
  renderList();
  renderMsgs();

  const am={role:"assistant",content:""};
  $("wrap").insertAdjacentHTML("beforeend",`
    <div class="row" id="live">
      <div class="av"></div>
      <div class="bub"><div class="dots"><i></i><i></i><i></i></div></div>
    </div>
  `);
  $("msgs").scrollTop=$("msgs").scrollHeight;

  busy=true;
  upd();
  ctrl=new AbortController();
  const live=()=>$("live")?.lastElementChild;

  try {
    const messages=await buildApiMessages(c);
    const userPayloads=messages.filter(x=>x.role==="user");
    if(!userPayloads.length) throw new Error("Нет сообщений для отправки.");
    const hasImages = messages.some(m=>Array.isArray(m.content));
    const selectedModel=$("modelSelect").value;
    const availablePool = hasImages ? IMAGE_MODEL_POOL : FREE_MODEL_POOL;
    const selectedWorksForInput = !hasImages || availablePool.includes(selectedModel);
    const requestModels = selectedModel === MODELS.auto || !selectedWorksForInput
      ? availablePool.slice()
      : [selectedModel,...availablePool.filter(m=>m!==selectedModel)];

    // OpenRouter tries these models in order if an earlier model/provider fails.
    // This is one routed request and produces one assistant answer, not one answer per model.
    const r=await fetch(API_URL+"?p=chat/completions",{
      method:"POST",
      signal:ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:requestModels[0],
        models:requestModels,
        messages,
        stream:true,
        max_tokens:8192,
        provider:{allow_fallbacks:true}
      })
    });

    if(!r.ok) {
      let t="";
      try { t=await r.text(); } catch(e) {}
      throw new Error("Ошибка "+r.status+(t?": "+t.slice(0,500):""));
    }

    const ct=r.headers.get("content-type")||"";
    if(ct.includes("event-stream")&&r.body) {
      const rd=r.body.getReader();
      const dec=new TextDecoder();
      let buf="";
      while(true) {
        const {done,value}=await rd.read();
        if(done)break;
        buf+=dec.decode(value,{stream:true});
        const parts=buf.split("\n");
        buf=parts.pop();
        for(const p of parts) {
          const line=p.trim();
          if(!line.startsWith("data:"))continue;
          const data=line.slice(5).trim();
          if(data==="[DONE]")continue;
          let j;
          try { j=JSON.parse(data); } catch(e) { continue; }
          if (j.error || j.choices?.[0]?.finish_reason === "error") {
            const detail=j.error?.message||j.error?.metadata?.error_type||"Модели временно недоступны";
            throw new Error(detail);
          }
          let piece=j.choices?.[0]?.delta?.content||"";
          if(Array.isArray(piece)) piece=piece.map(x=>x.text||"").join("");
          if(typeof piece==="string"&&piece) {
            am.content+=piece;
            if(live()) live().innerHTML=md(am.content);
            $("msgs").scrollTop=$("msgs").scrollHeight;
          }
        }
      }
    } else {
      const j=await r.json();
      if (j.error) throw new Error(j.error.message||"Модели временно недоступны");
      const result=j.choices?.[0]?.message?.content||"";
      am.content=typeof result==="string"?result:
        Array.isArray(result)?result.map(x=>x.text||"").join(""):String(result);
      if(live())live().innerHTML=md(am.content);
    }

    if(am.content) c.messages.push(am);
    if(!am.content && live()) live().innerHTML="<span>Модель не вернула ответ.</span>";

  } catch(e) {
    if(e.name==="AbortError") {
      if(am.content)c.messages.push(am);
      else if($("live"))$("live").remove();
    } else {
      const hint=e.message==="Failed to fetch"
        ? "Не удалось подключиться к серверу. Проверьте API и интернет."
        : e.message;
      if(live())live().innerHTML=`<div class="err">${esc(hint)}</div>`;
    }
  }

  busy=false;
  ctrl=null;
  saveChats();
  upd();
  if(am.content)renderMsgs();
}

/* SEND BUTTON */

function upd() {

  const s=$("send");

  if(busy) {

    s.disabled=false;

    s.innerHTML=`
      <svg width="14" height="14" viewBox="0 0 24 24"
        fill="currentColor">
        <rect x="5" y="5" width="14" height="14" rx="2"/>
      </svg>
    `;

  } else {

    s.innerHTML=`
      <svg width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    `;

    s.disabled=!$("inp").value.trim() && pendingAttachments.length===0;

  }

}

function grow() {

  const t=$("inp");

  t.style.height="auto";
  t.style.height=Math.min(t.scrollHeight,200)+"px";

}


/* SETTINGS */

function openSet() {

  $("kSys").value=systemPrompt;
  $("mod").classList.add("on");

}

$("setBtn").onclick=()=>{
  openSet();
  closeSide();
};

$("cancel").onclick=()=>{
  $("mod").classList.remove("on");
};

$("save").onclick=()=>{

  systemPrompt=$("kSys").value.trim()||DEFAULT_SYS;

  saveSystem();

  $("mod").classList.remove("on");

};


/* EVENTS */

$("attachBtn").onclick=()=>$("fileInput").click();
$("fileInput").addEventListener("change",e=>addFiles(e.target.files));

$("attachmentTray").addEventListener("click",e=>{
  const button=e.target.closest("[data-remove-attachment]");
  if(!button)return;
  const index=Number(button.dataset.removeAttachment);
  const removed=pendingAttachments.splice(index,1)[0];
  if(removed) {
    // Deleting from the temporary tray does not affect files already sent in chat.
  }
  renderPendingAttachments();
  upd();
});

$("inp").addEventListener("input",()=>{
  grow();
  upd();
});

$("inp").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)) {
    e.preventDefault();
    send($("inp").value);
  }
});

$("send").onclick=()=>{
  if(busy&&ctrl)ctrl.abort();
  else send($("inp").value);
};

$("newBtn").onclick=()=>{
  cur=null;
  pendingAttachments=[];
  renderPendingAttachments();
  renderList();
  renderMsgs();
  closeSide();
  $("inp").focus();
  upd();
};

$("burger").onclick=()=>{
  $("side").classList.add("on");
  $("back").classList.add("on");
};

$("back").onclick=closeSide;

/* MESSAGE ACTIONS, CODE EXPORTS AND SUGGESTIONS */

$("wrap").addEventListener("click",async e=>{
  const suggestion=e.target.closest("[data-s]");
  if(suggestion) {
    send(suggestion.dataset.s);
    return;
  }

  const copyCode=e.target.closest("[data-copy]");
  if(copyCode) {
    const code=copyCode.closest(".pre").querySelector("code").textContent;
    try {
      await navigator.clipboard.writeText(code);
      copyCode.textContent="Скопировано";
      setTimeout(()=>copyCode.textContent="Копировать",1400);
    } catch(err) { alert("Не удалось скопировать код."); }
    return;
  }

  const downloadCode=e.target.closest("[data-download-code]");
  if(downloadCode) {
    const code=downloadCode.closest(".pre").querySelector("code").textContent;
    const lang=(downloadCode.dataset.lang||"txt").toLowerCase();
    const ext=extensionForLanguage(lang);
    downloadBlob(code,`venus-ai-code.${ext}`,"text/plain;charset=utf-8");
    return;
  }

  const index=Number(e.target.closest("[data-index]")?.dataset.index);
  const c=active();
  if(!c || !Number.isInteger(index))return;
  const message=c.messages[index];
  if(!message || message.role!=="assistant")return;

  if(e.target.closest("[data-copy-answer]")) {
    try {
      await navigator.clipboard.writeText(message.content||"");
      e.target.closest("[data-copy-answer]").textContent="Скопировано";
    } catch(err) { alert("Не удалось скопировать ответ."); }
    return;
  }

  if(e.target.closest("[data-share-answer]")) {
    const payload={title:"Ответ Venus AI",text:message.content||""};
    try {
      if(navigator.share) await navigator.share(payload);
      else {
        await navigator.clipboard.writeText(payload.text);
        alert("Ответ скопирован — его можно отправить.");
      }
    } catch(err) {
      if(err.name!=="AbortError") alert("Не удалось поделиться ответом.");
    }
    return;
  }

  if(e.target.closest("[data-download-answer]")) {
    downloadBlob(message.content||"",`venus-ai-answer-${index+1}.md`,"text/markdown;charset=utf-8");
    return;
  }

  if(e.target.closest("[data-retry]")) {
    retryMessage(index);
  }
});
</script>
