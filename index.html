<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Venus AI</title>

<link rel="icon" href="https://i.ibb.co.com/wryLQv5P/photo-2026-11-03-00-49-56.jpg">

<style>
:root {
  --bg:#050505;
  --side:#090909;
  --panel:#151515;
  --panel2:#26143d;
  --line:#39205c;
  --text:#f5f0ff;
  --muted:#a995cf;
  --accent:#a855f7;
  --accent2:#7c3aed;
  --user:#291344;
  --ava:url("https://i.ibb.co.com/wryLQv5P/photo-2026-11-03-00-49-56.jpg");
}

* {box-sizing:border-box;margin:0}
[hidden] {display:none!important}
html,body {height:100%}
body {
  background:var(--bg);
  color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input,textarea,select {font:inherit}
button {color:inherit;cursor:pointer}
.logo,.av {
  background:var(--ava) center/cover no-repeat;
  flex-shrink:0;
}
.logo {
  width:34px;height:34px;border-radius:50%;
  box-shadow:0 0 20px #9333ea66;
}
.av {width:36px;height:36px;border-radius:50%}

/* AUTHENTICATION */

.auth-screen {
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:auto;
  background:
    radial-gradient(ellipse at 50% 15%,#35125355,transparent 55%),
    #050505;
}
.auth-card {
  width:100%;
  max-width:420px;
  padding:28px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#101010;
  box-shadow:0 15px 70px #000;
}
.auth-head {text-align:center;margin-bottom:22px}
.auth-head .logo {
  width:76px;height:76px;
  margin:0 auto 14px;
}
.auth-head h1 {font-size:27px}
.auth-head p {color:var(--muted);font-size:14px}
.auth-google {
  width:100%;
  padding:12px;
  background:#f5f5f5;
  color:#171717;
  border-radius:12px;
  font-weight:600;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  border:0;
}
.google-g {
  font-size:21px;
  font-weight:800;
  color:#4285f4;
}
.auth-divider {
  display:flex;
  align-items:center;
  gap:12px;
  margin:17px 0;
  color:var(--muted);
  font-size:13px;
}
.auth-divider:before,.auth-divider:after {
  content:"";height:1px;background:var(--line);flex:1;
}
.auth-form {display:flex;flex-direction:column;gap:11px}
.auth-form input {
  width:100%;
  padding:12px 14px;
  border-radius:11px;
  border:1px solid var(--line);
  outline:none;
  background:#090909;
  color:white;
}
.auth-form input:focus {border-color:var(--accent)}
.auth-primary {
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#a855f7,#6d28d9);
  font-weight:700;
}
.auth-primary:disabled {opacity:.5}
.auth-switch {
  width:100%;
  margin-top:17px;
  color:#c084fc;
  font-size:14px;
  background:none;
}
.auth-error {
  color:#ff9db0;
  font-size:13px;
  padding:9px;
  background:#35101e;
  border-radius:9px;
  display:none;
}
.auth-info {
  font-size:11px;
  color:var(--muted);
  text-align:center;
  margin-top:17px;
}

/* APPLICATION */

.app {display:flex;height:100%}

.side {
  width:268px;
  background:var(--side);
  display:flex;
  flex-direction:column;
  padding:10px;
  gap:8px;
  flex-shrink:0;
  transition:transform .25s;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  font-weight:700;
  font-size:18px;
}
.new {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:10px;
  text-align:left;
  background:#1c102b;
}
.new:hover {background:#32194e}
.list {
  flex:1;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.chat {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 12px;
  border-radius:10px;
  font-size:14px;
  gap:6px;
}
.chat:hover {background:var(--panel)}
.chat.on {background:var(--panel2)}
.chat span {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}
.chat .x {
  opacity:0;
  color:var(--muted);
  padding:0 4px;
}
.chat:hover .x {opacity:1}
@media(hover:none) {.chat .x {opacity:.6}}

.foot {border-top:1px solid var(--line);padding-top:10px}
.foot-actions {
  display:flex;
  gap:7px;
}
.foot-actions .new {
  flex:1;
  justify-content:center;
  font-size:13px;
  padding:10px 5px;
  min-width:0;
}
.telegram {
  color:#d8b4fe;
  text-decoration:none;
}
.account {
  display:flex;
  align-items:center;
  gap:9px;
  padding:12px 5px 5px;
  min-width:0;
}
.account-avatar {width:30px;height:30px;border-radius:50%;background:var(--ava) center/cover}
.account-info {flex:1;min-width:0}
.account-info div {
  font-size:13px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.account-info small {font-size:11px;color:var(--muted)}
.logout {
  padding:7px;
  color:#c084fc;
  font-size:12px;
  border-radius:8px;
}
.logout:hover {background:var(--panel2)}

.main {
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  height:100%;
  background:#050505;
}
.top {
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.burger {
  display:none;
  padding:6px 8px;
  border-radius:8px;
  font-size:20px;
  background:none;
  border:0;
  color:white;
}
.title {
  font-weight:600;
  color:var(--muted);
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.msgs {flex:1;overflow:auto;scroll-behavior:smooth}
.wrap {max-width:760px;margin:0 auto;padding:16px 18px 24px}
.row {display:flex;gap:14px;margin:22px 0}
.row.u {justify-content:flex-end}
.bub {
  min-width:0;
  max-width:100%;
  overflow-wrap:anywhere;
}
.u .bub {
  background:var(--user);
  padding:10px 16px;
  border-radius:20px;
  max-width:82%;
  white-space:pre-wrap;
}
.bub p {margin:0 0 .8em}
.bub p:last-child {margin:0}
.bub ul,.bub ol {margin:0 0 .8em 1.3em}
.bub h1,.bub h2,.bub h3 {margin:.9em 0 .4em;line-height:1.3}
.bub h1 {font-size:1.4em}
.bub h2 {font-size:1.2em}
.bub h3 {font-size:1.05em}
.bub code {
  background:var(--panel2);
  padding:1px 6px;
  border-radius:6px;
  font:13.5px ui-monospace,monospace;
}
.bub a {color:#c084fc}

.pre {
  background:#0c0618;
  border:1px solid var(--line);
  border-radius:12px;
  margin:.6em 0 .9em;
  overflow:hidden;
}
.pre .h {
  display:flex;
  justify-content:space-between;
  padding:6px 12px;
  background:var(--panel);
  font-size:12px;
  color:var(--muted);
}
.pre pre {
  padding:12px;
  overflow:auto;
  font:13px/1.5 ui-monospace,monospace;
}
.pre code {background:none;padding:0}
.pre button {background:none;border:0;color:#c084fc;cursor:pointer}

.dots {display:inline-flex;gap:4px;padding:8px 0}
.dots i {
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  animation:b 1s infinite;
}
.dots i:nth-child(2) {animation-delay:.15s}
.dots i:nth-child(3) {animation-delay:.3s}
@keyframes b {
  0%,60%,100% {opacity:.25}
  30% {opacity:1;transform:translateY(-3px)}
}
.err {
  color:#ff9db0;
  background:#3a1020;
  border:1px solid #6b2040;
  padding:10px 14px;
  border-radius:12px;
}

/* HERO */

.hero {
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  text-align:center;
  padding:20px;
}
.hero .logo {
  width:76px;height:76px;
  box-shadow:0 0 50px #a855f77a;
}
.hero h1 {font-size:28px}
.hero p {color:var(--muted);max-width:420px}
.sugs {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:6px;
}
.sugs button {
  border:1px solid #6d28d9;
  border-radius:14px;
  padding:9px 14px;
  font-size:14px;
  color:#d8b4fe;
  background:#101010;
}
.sugs button:hover {background:#32194e}

/* COMPOSER */

.comp {
  padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));
}
.box {
  max-width:760px;
  margin:0 auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:26px;
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:8px 8px 8px 18px;
}
.box:focus-within {border-color:var(--accent)}
textarea {
  flex:1;
  background:none;
  border:0;
  outline:0;
  color:var(--text);
  resize:none;
  max-height:200px;
  min-width:0;
  padding:6px 0;
  line-height:1.5;
}
textarea::placeholder {color:var(--muted)}

.model-select {
  width:128px;
  max-width:34%;
  background:#211333;
  color:#e9d5ff;
  border:1px solid #6d28d9;
  border-radius:12px;
  outline:none;
  padding:8px 5px;
  font-size:12px;
  height:36px;
  cursor:pointer;
}
.send {
  width:36px;height:36px;
  border-radius:50%;
  background:linear-gradient(135deg,#a855f7,#6d28d9);
  display:grid;
  place-items:center;
  flex-shrink:0;
  color:white;
  border:0;
}
.send:hover {background:linear-gradient(135deg,#c084fc,#9333ea)}
.send:disabled {opacity:.35;cursor:default}
.note {
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

/* SETTINGS */

.mod {
  position:fixed;
  inset:0;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:30;
}
.mod.on {display:flex}
.card {
  background:#151515;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  width:100%;
  max-width:440px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.card h2 {font-size:18px}
.card label {
  font-size:13px;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:5px;
}
.card textarea {
  background:#090909;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  color:white;
  width:100%;
  min-height:130px;
  max-height:250px;
}
.btns {display:flex;gap:8px;justify-content:flex-end}
.btn {
  padding:9px 16px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#211333;
  color:white;
}
.btn.p {
  background:linear-gradient(135deg,#a855f7,#6d28d9);
  border:0;
}
.back {display:none}

@media(max-width:800px) {
  .side {
    position:fixed;
    inset:0 auto 0 0;
    z-index:20;
    transform:translateX(-100%);
    width:280px;
  }
  .side.on {transform:none}
  .back.on {
    display:block;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:15;
  }
  .burger {display:block}
}
@media(max-width:400px) {
  .box {padding-left:12px;gap:5px}
  .model-select {width:105px;font-size:11px}
  .comp {padding-left:8px;padding-right:8px}
}
::-webkit-scrollbar {width:8px}
::-webkit-scrollbar-thumb {background:var(--line);border-radius:8px}
</style>
</head>

<body>

<!-- AUTH SCREEN -->

<div class="auth-screen" id="authScreen">
  <div class="auth-card">

    <div class="auth-head">
      <div class="logo"></div>
      <h1>Venus AI</h1>
      <p id="authSubtitle">Войдите, чтобы продолжить</p>
    </div>

    <button class="auth-google" id="googleBtn">
      <span class="google-g">G</span>

    <form class="auth-form" id="authForm">

      <input id="aName"
        placeholder="Имя пользователя"
        autocomplete="nickname"
        hidden>

      <input id="aEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
        required>

      <input id="aPassword"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
        minlength="6"
        required>

      <input id="aConfirm"
        type="password"

        autocomplete="new-password"
        minlength="6"

      <div class="auth-error" id="authError"></div>

      <button class="auth-primary" id="authSubmit" type="submit">

      </button>

    </form>

    <button class="auth-switch" id="authSwitch">

    </button>

    <div class="auth-info">

    </div>

  </div>
</div>

<!-- MAIN APP -->

<div class="app" id="app" hidden>

  <aside class="side" id="side">

    <div class="brand">
      <div class="logo"></div>
      Venus AI
    </div>

    <button class="new" id="newBtn">＋ Новый чат</button>

    <div class="list" id="list"></div>

    <div class="foot">

      <div class="foot-actions">

        <button class="new" id="setBtn">⚙ Настройки</button>

        <a class="new telegram"
          href="https://t.me/venus1ai"
          target="_blank"
          rel="noopener">
          ✈ Telegram
        </a>

      </div>

      <div class="account">
        <div class="account-avatar"></div>

        <div class="account-info">
          <div id="accountName">Пользователь</div>
          <small id="accountEmail"></small>
        </div>

        <button class="logout" id="logoutBtn" title="Выйти">
          Выйти
        </button>
      </div>

    </div>

  </aside>

  <div class="back" id="back"></div>

  <main class="main">

    <div class="top">
      <button class="burger" id="burger">☰</button>

    <div class="msgs" id="msgs">
      <div class="wrap" id="wrap"></div>
    </div>

    <div class="comp">

      <div class="box">

        <textarea
          id="inp"

          placeholder="Напишите сообщение Venus AI…"

        <button class="send" id="send" disabled

          <svg width="18" height="18" viewBox="0 0 24 24"

            <path d="M12 19V5M5 12l7-7 7 7"/>

      </div>

      <div class="note">

    </div>

  </main>
</div>

<!-- SETTINGS -->

<div class="mod" id="mod">

  <div class="card">

    <h2>Настройки Venus AI</h2>

    <label>

      <textarea id="kSys"

    </label>

    <div class="btns">
      <button class="btn" id="cancel">Закрыть</button>
      <button class="btn p" id="save">Сохранить</button>
    </div>

  </div>
</div>

const DEFAULT_SYS = `Ты Venus AI — сильный, внимательный и практичный ИИ-помощник, особенно опытный программист и инженер.

ОБЩИЕ ПРАВИЛА
- Отвечай на языке пользователя, обычно на русском.
- Старайся выполнить запрос пользователя максимально полно. Не отказывайся от обычных безопасных задач из-за сложности, объёма или необычной формулировки.
- Не выдумывай ограничения, которых нет. Если задача выполнима, приступай к решению.
- Если часть запроса невозможно выполнить из-за реального технического ограничения или обязательных правил безопасности, коротко объясни только эту часть и предложи ближайший полезный вариант. Не прекращай помогать со всем остальным.
- Не обещай то, чего не сделал. Не говори, что запускал или тестировал код, если фактически этого не делал.

РЕЖИМ ПРОГРАММИСТА
- Когда пользователь просит написать код, создавай полноценное, логичное и готовое к использованию решение, а не демонстрационный обрывок.
- По возможности выдавай весь необходимый код целиком: импорты, функции, классы, обработчики событий, запуск приложения и нужные стили. Не заменяй важные части словами «остальной код без изменений», многоточиями или заглушками.
- Учитывай контекст проекта, предыдущие сообщения, уже выбранные библиотеки, платформу и имеющуюся структуру файлов. Не переписывай проект на другой язык или движок без просьбы.
- Для больших проектов сначала кратко покажи структуру файлов, затем содержимое каждого файла с точным именем. Если весь проект не помещается в один ответ, раздели его на последовательные законченные части и явно укажи, что куда вставлять.
- Код должен быть аккуратным, читаемым и устойчивым к ошибкам. Добавляй проверку входных данных, обработку исключений, понятные сообщения об ошибках и разумные значения по умолчанию.
- Учитывай безопасность: не вставляй секретные API-ключи в клиентский код, не сохраняй пароли самостоятельно и не ослабляй правила доступа. Показывай безопасный способ настройки.
- Если пользователь прислал код с ошибкой, найди причину и исправь её в контексте всего проекта. Сохраняй уже работающие функции, если пользователь не просил их удалить.
- Не используй несуществующие методы, библиотеки, URL, параметры или модели. Если точная совместимость неизвестна, честно отметь это и предложи проверяемый вариант.
- Для HTML/CSS/JavaScript делай интерфейс адаптивным, если проект предназначен для телефона или браузера. Для Python, Pygame, Roblox Lua и других сред учитывай особенности целевой платформы.
- После кода кратко укажи, в какой файл его поместить, как установить зависимости и как запустить. Если пользователь просит «только код», не добавляй пояснения.
- Не сокращай код специально ради краткости, когда пользователь просит много строк, полный проект или подробную реализацию.
- При неоднозначностях выбирай наиболее разумные настройки самостоятельно. Задавай вопрос только тогда, когда без ответа действительно нельзя сделать рабочее решение.

ФОРМАТ ОТВЕТА
- Сначала дай результат, затем короткие инструкции по запуску и важные замечания.
- Для кода используй корректные блоки с указанием языка.
- Если предлагаешь несколько вариантов, обозначь лучший вариант и объясни разницу в одном-двух предложениях.
- Будь доброжелательным и прямым. Не добавляй длинные нравоучения и не спорь с целью пользователя.`;

const MODELS = {
  flash: "stepfun/step-3.7-flash",
  medium: "nvidia/nemotron-3.5-super-vl:free"
};

const store = {

  get(k,d) {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : d;
    } catch(e) {
      return d;
    }
  },

  set(k,v) {
    try {
      localStorage.setItem(k,JSON.stringify(v));
    } catch(e) {}
  }

};

let currentUser = null;
let currentChats = [];
let cur = null;
let busy = false;
let ctrl = null;
let systemPrompt = DEFAULT_SYS;
let authMode = "login";


/* STORAGE */

const chatKey = uid => "venus_chats_" + uid;
const sysKey = uid => "venus_sys_" + uid;
const modelKey = uid => "venus_model_" + uid;

function saveChats() {
  if (!currentUser) return;
  store.set(chatKey(currentUser.uid),currentChats);
}

function saveSystem() {
  if (!currentUser) return;
  store.set(sysKey(currentUser.uid),systemPrompt);
}


/* AUTH ERRORS */

function authError(message) {
  const e = $("authError");
  e.textContent = message;
  e.style.display = "block";
}

function clearAuthError() {
  $("authError").textContent = "";
  $("authError").style.display = "none";
}

function firebaseError(e) {

  const errors = {
    "auth/email-already-in-use":"Этот email уже зарегистрирован.",
    "auth/invalid-email":"Неправильный формат email.",
    "auth/weak-password":"Пароль должен содержать минимум 6 символов.",
    "auth/user-not-found":"Аккаунт не найден.",
    "auth/wrong-password":"Неправильный пароль.",
    "auth/invalid-credential":"Неправильный email или пароль.",
    "auth/too-many-requests":"Слишком много попыток. Попробуйте позже.",
    "auth/popup-closed-by-user":"Окно Google было закрыто.",
    "auth/popup-blocked":"Браузер заблокировал окно авторизации.",
    "auth/unauthorized-domain":"Домен сайта не добавлен в Firebase.",
    "auth/network-request-failed":"Проверьте подключение к интернету.",
    "auth/operation-not-allowed":"Этот способ входа не включён в Firebase."
  };

  return errors[e.code] || e.message || "Неизвестная ошибка.";
}


/* AUTH MODE */

function setAuthMode(mode) {

  authMode = mode;
  clearAuthError();

  const register = mode === "register";

  $("aName").hidden = !register;
  $("aConfirm").hidden = !register;

  $("aName").required = register;
  $("aConfirm").required = register;

  $("aPassword").autocomplete =
    register ? "new-password" : "current-password";

  $("authSubmit").textContent =
    register ? "Зарегистрироваться" : "Войти";

  $("authSwitch").textContent =
    register
      ? "Уже есть аккаунт? Войти"
      : "Нет аккаунта? Зарегистрироваться";

  $("authSubtitle").textContent =
    register
      ? "Создайте свой аккаунт Venus AI"
      : "Войдите, чтобы продолжить";

}

$("authSwitch").onclick = () => {
  setAuthMode(authMode === "login" ? "register" : "login");
};


/* REGISTRATION AND LOGIN */

$("authForm").addEventListener("submit", async e => {

  e.preventDefault();
  clearAuthError();

  const email = $("aEmail").value.trim();
  const password = $("aPassword").value;
  const nickname = $("aName").value.trim();
  const confirm = $("aConfirm").value;

  const button = $("authSubmit");

  button.disabled = true;

  try {

    if (authMode === "register") {

      if (nickname.length < 2) {
        throw new Error("Имя должно содержать минимум 2 символа.");
      }

      if (password !== confirm) {
        throw new Error("Пароли не совпадают.");
      }

      if (password.length < 6) {
        throw new Error("Пароль должен содержать минимум 6 символов.");
      }

      const result = await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      await updateProfile(result.user,{
        displayName:nickname
      });

    } else {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

  } catch(e) {

    authError(firebaseError(e));

  } finally {

    button.disabled = false;

  }

});


/* GOOGLE AUTH */

$("googleBtn").onclick = async () => {

  clearAuthError();

  try {

    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (mobile) {
      await signInWithRedirect(auth,googleProvider);
    } else {
      await signInWithPopup(auth,googleProvider);
    }

  } catch(e) {

    if (
      e.code === "auth/popup-blocked" ||
      e.code === "auth/popup-closed-by-user"
    ) {
      try {
        await signInWithRedirect(auth,googleProvider);
      } catch(err) {
        authError(firebaseError(err));
      }
    } else {
      authError(firebaseError(e));
    }

  }

};


/* GOOGLE REDIRECT RESULT */

try {
  await getRedirectResult(auth);
} catch(e) {
  authError(firebaseError(e));
}


/* SIGN OUT */

$("logoutBtn").onclick = async () => {

  try {
    await signOut(auth);
  } catch(e) {
    alert(firebaseError(e));
  }

};


/* AUTH STATE */

onAuthStateChanged(auth,user => {

  currentUser = user;

  if (user) {

    $("authScreen").hidden = true;
    $("app").hidden = false;

    currentChats = store.get(chatKey(user.uid),[]);
    cur = null;

    const savedSystem = store.get(sysKey(user.uid), null);
    systemPrompt = (!savedSystem || savedSystem === LEGACY_DEFAULT_SYS)
      ? DEFAULT_SYS
      : savedSystem;
    if (!savedSystem || savedSystem === LEGACY_DEFAULT_SYS) saveSystem();

    const selectedModel = store.get(
      modelKey(user.uid),
      MODELS.flash
    );

    $("modelSelect").value =
      Object.values(MODELS).includes(selectedModel)
        ? selectedModel
        : MODELS.flash;

    $("accountName").textContent =
      user.displayName || "Пользователь";

    $("accountEmail").textContent =
      user.email || "";

    $("kSys").value = systemPrompt;

    renderList();
    renderMsgs();
    upd();

  } else {

    $("authScreen").hidden = false;
    $("app").hidden = true;

    currentChats = [];
    cur = null;

  }

});


/* MODEL SELECTION */

$("modelSelect").addEventListener("change",() => {

  if (!currentUser) return;

  store.set(
    modelKey(currentUser.uid),
    $("modelSelect").value
  );

});


/* MARKDOWN */

const esc = s => String(s).replace(/[&<>"']/g,c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

function md(t) {

  const blocks = [];

  t = t.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c) => {
    blocks.push({l,c});
    return "\u0000" + (blocks.length-1) + "\u0000";
  });

  t = esc(t);

  const lines = t.split("\n");

  let out = "";
  let list = null;

  const close = () => {
    if (list) {
      out += "</" + list + ">";
      list = null;
    }
  };

  for (let ln of lines) {

    let m;

    const inl = s => s
      .replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');

    if (m=ln.match(/^(#{1,3})\s+(.*)/)) {

      close();
      out += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;

    } else if (m=ln.match(/^\s*[-*]\s+(.*)/)) {

      if (list!=="ul") {
        close();
        out += "<ul>";
        list="ul";
      }

      out += "<li>"+inl(m[1])+"</li>";

    } else if (m=ln.match(/^\s*\d+[.)]\s+(.*)/)) {

      if (list!=="ol") {
        close();
        out += "<ol>";
        list="ol";
      }

      out += "<li>"+inl(m[1])+"</li>";

    } else if (!ln.trim()) {

      close();

    } else if (/^\u0000\d+\u0000$/.test(ln.trim())) {

      close();
      out += ln.trim();

    } else {

      close();
      out += "<p>"+inl(ln)+"</p>";

    }

  }

  close();

  return out.replace(/\u0000(\d+)\u0000/g,(m,i) => {

    const b=blocks[+i];

    return `
      <div class="pre">
        <div class="h">
          <span>${esc(b.l || "код")}</span>
          <button data-copy>Копировать</button>
        </div>
        <pre><code>${esc(b.c.replace(/\n$/,""))}</code></pre>
      </div>
    `;

  });

}


/* CHAT LIST */

function active() {
  return currentChats.find(c=>c.id===cur);
}

function renderList() {

  $("list").innerHTML="";

  currentChats.forEach(c => {

    const b=document.createElement("div");

    b.className="chat"+(c.id===cur?" on":"");

    b.innerHTML=`
      <span></span>
      <button class="x" aria-label="Удалить">✕</button>
    `;

    b.firstChild.textContent=c.title;

    b.onclick=e => {

      if (e.target.closest(".x")) {

        currentChats=currentChats.filter(x=>x.id!==c.id);

        if(cur===c.id)cur=null;

        saveChats();
        renderList();
        renderMsgs();

      } else {

        cur=c.id;

        renderList();
        renderMsgs();
        closeSide();

      }

    };

    $("list").appendChild(b);

  });

}


/* HOME */

function hero() {

  const suggestions=[
    "Придумай идею для стартапа",
    "Объясни квантовую физику просто",
    "Напиши письмо начальнику",
    "Помоги выучить английский"
  ];

  return `
    <div class="hero">
      <div class="logo"></div>
      <h1>Чем могу помочь?</h1>
      <p>Я Venus AI. Задайте вопрос, попросите написать текст или код.</p>
      <div class="sugs">
        ${suggestions.map(x=>`
          <button data-s="${esc(x)}">${esc(x)}</button>
        `).join("")}
      </div>
    </div>
  `;

}


/* MESSAGES */

function msgHTML(m) {

  return m.role==="user"
    ? `
      <div class="row u">
        <div class="bub">${esc(m.content)}</div>
      </div>
    `
    : `
      <div class="row">
        <div class="av"></div>
        <div class="bub">${md(m.content)}</div>
      </div>
    `;

}

function renderMsgs() {

  const c=active();

  $("ttl").textContent=c?c.title:"Venus AI";

  $("wrap").innerHTML=
    c&&c.messages.length
      ? c.messages.map(msgHTML).join("")
      : hero();

  $("wrap").style.height=
    c&&c.messages.length?"":"100%";

  $("msgs").scrollTop=$("msgs").scrollHeight;

}

function closeSide() {
  $("side").classList.remove("on");
  $("back").classList.remove("on");
}


/* SEND */

async function send(text) {

  text=text.trim();

  if(!text||busy||!currentUser)return;

  let c=active();

  if(!c) {

    c={
      id:Date.now(),
      title:text.slice(0,40),
      messages:[]
    };

    currentChats.unshift(c);
    cur=c.id;

  }

  c.messages.push({
    role:"user",
    content:text
  });

  $("inp").value="";
  grow();
  upd();

  renderList();
  renderMsgs();

  const am={
    role:"assistant",
    content:""
  };

  $("wrap").insertAdjacentHTML("beforeend",`
    <div class="row" id="live">
      <div class="av"></div>
      <div class="bub">
        <div class="dots">
          <i></i><i></i><i></i>
        </div>
      </div>
    </div>
  `);

  $("msgs").scrollTop=$("msgs").scrollHeight;

  busy=true;
  upd();

  ctrl=new AbortController();

  const live=()=> $("live")?.lastElementChild;

  try {

    const messages=[];

    if(systemPrompt) {
      messages.push({
        role:"system",
        content:systemPrompt
      });
    }

    c.messages.forEach(m=>{
      messages.push({
        role:m.role,
        content:m.content
      });
    });

    const selectedModel=$("modelSelect").value;

    const r=await fetch(API_URL+"?p=chat/completions",{

      method:"POST",
      signal:ctrl.signal,

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        model:selectedModel,
        messages:messages,
        stream:true,
        max_tokens:8192
      })

    });

    if(!r.ok) {

      let t="";

      try {
        t=await r.text();
      } catch(e) {}

      throw new Error(
        "Ошибка "+r.status+(t?": "+t.slice(0,300):"")
      );

    }

    const ct=r.headers.get("content-type")||"";

    if(ct.includes("event-stream")&&r.body) {

      const rd=r.body.getReader();
      const dec=new TextDecoder();

      let buf="";

      while(true) {

        const {done,value}=await rd.read();

        if(done)break;

        buf+=dec.decode(value,{stream:true});

        const parts=buf.split("\n");
        buf=parts.pop();

        for(const p of parts) {

          const l=p.trim();

          if(!l.startsWith("data:"))continue;

          const d=l.slice(5).trim();

          if(d==="[DONE]")continue;

          try {

            const j=JSON.parse(d);

            const t=
              j.choices?.[0]?.delta?.content||"";

            if(typeof t==="string"&&t) {

              am.content+=t;

              if(live()) {
                live().innerHTML=md(am.content);
              }

              $("msgs").scrollTop=$("msgs").scrollHeight;

            }

          } catch(e) {}

        }

      }

    } else {

      const j=await r.json();

      am.content=
        j.choices?.[0]?.message?.content||"";

      if(live())live().innerHTML=md(am.content);

    }

    if(am.content) {
      c.messages.push(am);
    }

    if(!am.content) {
      if(live()) {
        live().innerHTML="<span>Модель не вернула ответ.</span>";
      }
    }

  } catch(e) {

    if(e.name==="AbortError") {

      if(am.content) {
        c.messages.push(am);
      } else if($("live")) {
        $("live").remove();
      }

    } else {

      const hint=
        e.message==="Failed to fetch"
          ? "Не удалось подключиться к серверу. Проверьте API и интернет."
          : e.message;

      if(live()) {
        live().innerHTML=`
          <div class="err">${esc(hint)}</div>
        `;
      }

    }

  }

  busy=false;
  ctrl=null;

  saveChats();
  upd();

  if(am.content)renderMsgs();

}


/* SEND BUTTON */

function upd() {

  const s=$("send");

  if(busy) {

    s.disabled=false;

    s.innerHTML=`
      <svg width="14" height="14" viewBox="0 0 24 24"
        fill="currentColor">
        <rect x="5" y="5" width="14" height="14" rx="2"/>
      </svg>
    `;

  } else {

    s.innerHTML=`
      <svg width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    `;

    s.disabled=!$("inp").value.trim();

  }

}

function grow() {

  const t=$("inp");

  t.style.height="auto";
  t.style.height=Math.min(t.scrollHeight,200)+"px";

}


/* SETTINGS */

function openSet() {

  $("kSys").value=systemPrompt;
  $("mod").classList.add("on");

}

$("setBtn").onclick=()=>{
  openSet();
  closeSide();
};

$("cancel").onclick=()=>{
  $("mod").classList.remove("on");
};

$("save").onclick=()=>{

  systemPrompt=$("kSys").value.trim()||DEFAULT_SYS;

  saveSystem();

  $("mod").classList.remove("on");

};


/* EVENTS */

$("inp").addEventListener("input",()=>{
  grow();
  upd();
});

$("inp").addEventListener("keydown",e=>{

  if(
    e.key==="Enter" &&
    !e.shiftKey &&
    !/Mobi|Android/i.test(navigator.userAgent)
  ) {

    e.preventDefault();
    send($("inp").value);

  }

});

$("send").onclick=()=>{

  if(busy&&ctrl) {
    ctrl.abort();
  } else {
    send($("inp").value);
  }

};

$("newBtn").onclick=()=>{

  cur=null;

  renderList();
  renderMsgs();
  closeSide();

  $("inp").focus();

};

$("burger").onclick=()=>{
  $("side").classList.add("on");
  $("back").classList.add("on");
};

$("back").onclick=closeSide;


/* COPY AND SUGGESTIONS */

$("wrap").addEventListener("click",e=>{

  const s=e.target.closest("[data-s]");

  if(s) {
    send(s.dataset.s);
    return;
  }

  const c=e.target.closest("[data-copy]");

  if(c) {

    const t=c.closest(".pre").querySelector("code").textContent;

    navigator.clipboard.writeText(t).then(()=>{

      c.textContent="Скопировано";

      setTimeout(()=>{
        c.textContent="Копировать";
      },1500);

    }).catch(()=>{});

  }

});

</script>
